name: Check Pull Request

on:
  pull_request:
    branches: [ "main", "develop" ]

env:
  GODOT_VERSION: 4.7
  PROJECT_PATH: .

jobs:
  Check-Build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        platform:
        - name: windows
          preset: windows
          os: windows
          file: samory.exe
    container:
      image: barichello/godot-ci:4.7
    steps:
      - uses: actions/checkout@v6
        with:
           lfs: true
           fetch-depth: 0
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Install git cliff
        run: |
           wget "https://github.com/orhun/git-cliff/releases/download/v2.13.1/git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz"
           tar -xvzf git-cliff-*.tar.gz
           cd "git-cliff-2.13.1"
           mv ./* /usr/local/bin/
           cd ..
           rmdir git-cliff-2.13.1
           rm git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz
           ls
      - name: Generate changelog
        run: |
           chmod +x ./ci/linux-changelog.sh
           git config --global --add safe.directory "$GITHUB_WORKSPACE"
           ./ci/linux-changelog.sh
           git config --unset --global safe.directory
      - name: Build ${{ matrix.platform.name }}
        run: |
          mkdir -v -p build/${{ matrix.platform.os }}
          EXPORT_DIR="$(readlink -f build)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-debug ${{ matrix.platform.preset }} "$EXPORT_DIR/${{ matrix.platform.os }}/${{ matrix.platform.file }}"
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Samory - ${{ matrix.platform.name }}
          path: build/${{ matrix.platform.os }}
